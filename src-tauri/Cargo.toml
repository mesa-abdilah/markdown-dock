[package]
name = "dynamic-markdown-dock"
version = "0.1.0"
description = "Dynamic Island style Markdown dock with zero-knowledge Google Drive backup"
authors = ["Dynamic Markdown Dock Contributors"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "dynamic_markdown_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "dynamic-acl", "x11", "dbus", "tray-icon", "macos-private-api", "specta"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = { version = "2", features = ["tracing"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
specta = { version = "=2.0.0-rc.28", features = ["derive", "function"] }
specta-typescript = "0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }

# Phase 2: Watcher, SQLite FTS5, Fuzzy Search, Markdown Parser & Renderer
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2.7"
r2d2 = "0.8"
r2d2_sqlite = "=0.36.0"
notify = "8.2"
notify-debouncer-full = "0.7"
walkdir = "2.5"
globset = "0.4"
rayon = "1.12"
nucleo-matcher = "0.3"
yaml-rust2 = "0.13"
comrak = { version = "1.0", default-features = false }
ammonia = "4.2"
sha2 = "0.11"
hex = "0.4"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

# Phase 3: Compression & Zero-Knowledge Cryptography
zstd = "0.14"
aes-gcm = "0.11"
chacha20poly1305 = "0.11"
argon2 = "0.6"
hkdf = "0.13"
hmac = "0.13"
getrandom = "0.4"
zeroize = { version = "1.9", features = ["derive"] }
secrecy = "0.10"
subtle = "2.6"
zxcvbn = "3.1"
keyring = "4.2"
ciborium = "0.2"
data-encoding = "2.11"

# Phase 4: Google Drive OAuth2 & Delta Sync
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "form", "query"] }
md-5 = "0.11"
url = "2.5"

[dev-dependencies]
tempfile = "3"
proptest = "1.12"
wiremock = "0.6"

[[bench]]
name = "search_bench"
harness = false

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
] }
webview2-com = "0.39"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
