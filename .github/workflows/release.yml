name: Release (Windows & Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional tag name (e.g. v0.1.0) to publish as GitHub Release"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            pkg-config \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundles & publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag_name != ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: "Dynamic Markdown Dock ${{ inputs.tag_name || github.ref_name }}"
          releaseBody: "Desktop installers for Windows (.exe / .msi) and Linux (.AppImage / .deb / .rpm)."
          releaseDraft: false
          prerelease: false

      - name: Build Tauri bundles (workflow_dispatch artifact without tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.tag_name == '' }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri build

      - name: Upload installer artifacts (manual run without tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.tag_name == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
